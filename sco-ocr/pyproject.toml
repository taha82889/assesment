[project]
name = "sco-ocr"
version = "0.1.0"
description = "Real-time OCR event stream for a self-checkout supervisor screen"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pydantic>=2",
  "pydantic-settings",
  "pyyaml",
  "rapidfuzz",
  "redis",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime", "pytesseract"]  # or: paddleocr + paddlepaddle
ws = ["websockets"]
gui = ["opencv-python"]  # replaces headless build; needed only for tools/calibrate.py
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real OCR on the local reference frame (~30s)"]
addopts = "-m 'not slow'"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
