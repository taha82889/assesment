# All geometry is a fraction of its parent: tiles of the bar-cropped frame,
# sub-ROIs of the tile. The values below are first guesses from the described
# screen; run tools/calibrate.py against a real reference frame to fix them.
grid:
  cols: 5
  rows: 3
  bounds: {x: 0.0068, y: 0.0608, w: 0.990, h: 0.9392}  # below the header buttons row
  unused: [12, 13, 14]                        # 0-based tile index; bottom-right three

crop:
  dark_threshold: 12     # mean intensity below this counts as black bar
  min_fraction: 0.2      # never crop away more than this fraction per side

rois:   # no LED-based status: status comes from the status button text
  title:       {x: 0.07, y: 0.04, w: 0.20, h: 0.08}
  meta:        {x: 0.02, y: 0.105, w: 0.32, h: 0.065}
  status_text: {x: 0.42, y: 0.04, w: 0.50, h: 0.11}
  items:       {x: 0.023, y: 0.19, w: 0.58, h: 0.59}
  total:       {x: 0.63, y: 0.80, w: 0.30, h: 0.075}
  to_pay:      {x: 0.63, y: 0.885, w: 0.30, h: 0.075}

# Change detection (phase 4), tunable per ROI type.
change:
  stable_frames: 2
  thresholds:        # mean abs diff on downscaled grayscale (0-255)
    items: 4.0
    total: 4.0
    to_pay: 4.0
    meta: 4.0

corruption:
  blockiness_ratio: 1.6    # boundary/interior gradient ratio above which a tile is blocky
  min_laplacian_var: 15.0  # below this the tile is smeared/flat
  max_dark_fraction: 0.3   # dark-pixel share of the items ROI (real panels: <= ~0.12)
  streak_ratio: 2.0        # horizontal/vertical gradient ratio (real panels: <= ~1.2)
  # flagged when (blocky AND smeared) OR (dark smear AND vertical streaks)

# Canonical status -> accepted texts (lowercase, matched with rapidfuzz in phase 3)
status_vocabulary:
  closed:     ["kassa gesloten", "caisse fermée"]
  idle:       ["wachtend", "en attente"]
  scanning:   ["bezig met scannen", "scan en cours"]
  paying:     ["betaling bezig", "paiement en cours"]
  ended:      ["transactie beëindigd", "transaction terminée"]
  assistance: ["hulp nodig", "assistance requise"]
